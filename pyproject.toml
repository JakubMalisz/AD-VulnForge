[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AD-VulnForge"
version = "0.1.0"
description = "..."
requires-python = ">=3.11"
dependencies = ["pywinrm>=0.4.3", "ldap3>=2.9.1", "typer>=0.12.0", "rich>=13.7.0", "pyyaml>=6.0.1", "python-dotenv>=1.0.1"]

[project.scripts]
ad-vulnforge = "ad_orchestrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
